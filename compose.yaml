services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD}
    command:
      - /bin/sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  baileys-api:
    image: ghcr.io/fazer-ai/baileys-api:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Configure REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure REDIS_PASSWORD}
      BAILEYS_PROVIDER_DEFAULT_API_KEY: ${BAILEYS_API_KEY:?Configure BAILEYS_API_KEY}
      LOG_LEVEL: info
      BAILEYS_LOG_LEVEL: error
    command:
      - sh
      - -c
      - 'bun manage-api-keys create user "$$BAILEYS_PROVIDER_DEFAULT_API_KEY" && bun start'
    volumes:
      - baileys-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3025/status >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [internal]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      baileys-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3080'
      BAILEYS_BASE_URL: http://baileys-api:3025
      BAILEYS_API_KEY: ${BAILEYS_API_KEY:?Configure BAILEYS_API_KEY}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Configure DASHBOARD_PASSWORD}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Configure WEBHOOK_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Configure PUBLIC_URL}
      WEBHOOK_BASE_URL: http://dashboard:3080
    expose:
      - '3080'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal]

volumes:
  redis-data:
  baileys-storage:

networks:
  internal:
    driver: bridge
